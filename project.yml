targets:
  Lode:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LodeApp
        excludes:
          - "Lode-Info.plist"
          - "App.entitlements"
    dependencies:
      - package: LumiFactory
        product: LumiFactory
      - package: LumiPluginSettingView
        product: PluginSettingView
      - package: LumiPluginRootView
