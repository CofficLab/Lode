    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffic.lode
        PRODUCT_NAME: Lode
        INFOPLIST_FILE: LodeApp/Lode-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lode
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y6HZ9JJYV6
        CODE_SIGN_ENTITLEMENTS: LodeApp/App.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  LodeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LodeTests
      - path: scripts/perf/launch-baseline.json
        buildPhase: resources
    dependencies:
      - target: Lode
      - package: LumiFactory
        product: LumiFactory
      - package: LumiPluginRootView
        product: WorkbenchRootView
      - package: LumiKernel
        product: KernelCore
      - package: LumiLogging
        product: LumiLoggingKit
      - package: LumiProviders
        product: ProviderChatSection
      - package: LumiProviders
        product: ProviderConversation
      - package: ProviderExternalFile
        product: ProviderExternalFile
      - package: LumiProviderToolManager
        product: ProviderToolManager
      - package: LumiProviders
        product: ProviderRailView
      - package: LumiProviders
        product: ProviderRootView
      - package: LumiProviders
        product: ProviderToolbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffic.lode.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lode.app/Contents/MacOS/Lode"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

schemes:
  Lode:
    build:
      targets:
        Lode: all
        LodeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LodeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release