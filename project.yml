name: Lode
options:
  bundleIdPrefix: com.coffic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  LumiFactory:
    url: https://github.com/lumi-softworks/LumiFactory.git
    from: 1.5.0
  LumiKernel:
    url: https://github.com/lumi-softworks/LumiKernel.git
    from: 1.1.1
  LumiProviders:
    url: https://github.com/lumi-softworks/LumiProviders.git
    from: 1.26.0
  LumiKitLLM:
    url: https://github.com/lumi-softworks/LumiKitLLM.git
    from: 1.0.1
  LumiLogging:
    url: https://github.com/lumi-softworks/LumiLogging.git
    from: 1.0.2
  LumiPluginRootView:
    url: https://github.com/lumi-softworks/LumiPluginRootView.git
    from: 1.3.2
  LumiProviderToolManager:
    url: https://github.com/lumi-softworks/LumiProviderToolManager.git
    from: 1.0.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.10.1
  LumiChat:
    path: ../../Lumi-Softworks/LumiChat
  PluginCodeEditorHost:
    path: Packages/PluginCodeEditorHost
  PluginDatabaseManager:
    path: Packages/PluginDatabaseManager
  PluginRootView:
    path: Packages/PluginRootView
  ProviderAgentLoop:
    path: ../Lumi/Packages/ProviderAgentLoop
  ProviderConversationInputBlock:
    path: ../Lumi/Packages/ProviderConversationInputBlock
  ProviderExternalFile:
    path: Packages/ProviderExternalFile
  ProviderLLMContext:
    path: ../Lumi/Packages/ProviderLLMContext
  ProviderLLMManager:
    path: ../Lumi/Packages/ProviderLLMManager
  ProviderLegacyData:
    path: Packages/ProviderLegacyData
  ProviderLifecycleHooks:
    path: ../Lumi/Packages/ProviderLifecycleHooks
  ProviderMessage:
    path: ../Lumi/Packages/ProviderMessage
  ProviderMessageRendering:
    path: ../Lumi/Packages/ProviderMessageRendering
  ProviderMessageStreaming:
    path: ../Lumi/Packages/ProviderMessageStreaming
  ProviderPromptSuggestionExecutor:
    path: ../Lumi/Packages/ProviderPromptSuggestionExecutor
  ProviderWebServer:
    path: Packages/ProviderWebServer

targets:
  Lode:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LodeApp
        excludes:
          - "Lode-Info.plist"
          - "App.entitlements"
    dependencies:
      - package: LumiFactory
        product: LumiFactory
      - package: LumiPluginRootView
        product: WorkbenchRootView
      - package: LumiKernel
        product: KernelCore
      - package: Sparkle
        product: Sparkle
      - package: PluginDatabaseManager
        product: PluginDatabaseManager
      - package: PluginCodeEditorHost
        product: PluginCodeEditorHost
      - package: PluginRootView
        product: LodePluginRootView
      - package: LumiKitLLM
        product: KitLLM
      - package: LumiChat
        product: PluginConversationInput
      - package: LumiChat
        product: PluginConversationState
      - package: LumiChat
        product: PluginMessageListStandard
      - package: LumiChat
        product: PluginMessageRenderer
      - package: LumiChat
        product: PluginMessageSender
      - package: LumiChat
        product: PluginModelSelector
      - package: LumiChat
        product: PluginLLMProviderSettings
      - package: LumiChat
        product: PluginLLMProviderOpenAI
      - package: ProviderAgentLoop
        product: ProviderAgentLoop
      - package: LumiProviders
        product: ProviderChatSection
      - package: LumiProviders
        product: ProviderConversation
      - package: ProviderConversationInputBlock
        product: ProviderConversationInputBlock
      - package: ProviderExternalFile
        product: ProviderExternalFile
      - package: ProviderLLMContext
        product: ProviderLLMContext
      - package: ProviderLLMManager
        product: ProviderLLMManager
      - package: ProviderLegacyData
        product: ProviderLegacyData
      - package: ProviderLifecycleHooks
        product: ProviderLifecycleHooks
      - package: ProviderMessage
        product: ProviderMessage
      - package: ProviderMessageRendering
        product: ProviderMessageRendering
      - package: ProviderMessageStreaming
        product: ProviderMessageStreaming
      - package: ProviderPromptSuggestionExecutor
        product: ProviderPromptSuggestionExecutor
      - package: ProviderWebServer
        product: ProviderWebServer
      - package: LumiProviderToolManager
        product: ProviderToolManager
      - package: LumiProviders
        product: ProviderAgentRules
      - package: LumiProviders
        product: ProviderCommand
      - package: LumiProviders
        product: ProviderConversationInput
      - package: LumiProviders
        product: ProviderDeveloperMode
      - package: LumiProviders
        product: ProviderIdleTime
      - package: LumiProviders
        product: ProviderNetwork
      - package: LumiProviders
        product: ProviderProject
      - package: LumiProviders
        product: ProviderPromptSuggestion
      - package: LumiProviders
        product: ProviderRailView
      - package: LumiProviders
        product: ProviderRootView
      - package: LumiProviders
        product: ProviderSkill
      - package: LumiProviders
        product: ProviderStorage
      - package: LumiProviders
        product: ProviderTheme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffic.lode
        PRODUCT_NAME: Lode
        INFOPLIST_FILE: LodeApp/Lode-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lode
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y6HZ9JJYV6
        CODE_SIGN_ENTITLEMENTS: LodeApp/App.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  LodeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LodeTests
      - path: scripts/perf/launch-baseline.json
        buildPhase: resources
    dependencies:
      - target: Lode
      - package: LumiFactory
        product: LumiFactory
      - package: LumiPluginRootView
        product: WorkbenchRootView
      - package: LumiKernel
        product: KernelCore
      - package: LumiLogging
        product: LumiLoggingKit
      - package: LumiProviders
        product: ProviderChatSection
      - package: LumiProviders
        product: ProviderConversation
      - package: ProviderExternalFile
        product: ProviderExternalFile
      - package: LumiProviderToolManager
        product: ProviderToolManager
      - package: LumiProviders
        product: ProviderRailView
      - package: LumiProviders
        product: ProviderRootView
      - package: LumiProviders
        product: ProviderToolbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffic.lode.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lode.app/Contents/MacOS/Lode"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

schemes:
  Lode:
    build:
      targets:
        Lode: all
        LodeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LodeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release