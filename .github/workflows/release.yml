name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-lode
  cancel-in-progress: false

permissions:
  contents: write

env:
  SCHEME: Lode
  ENTITLEMENTS_PATH: LodeApp/App.entitlements
  REPO_LINK: https://github.com/CofficLab/Lode
  R2_API_URL: https://data.coffic.cn

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Compute release version and tag
        run: |
          set -euo pipefail
          repo_version="$(awk '/MARKETING_VERSION:/{gsub(/"/, "", $2); print $2; exit}' project.yml)"
          [[ "$repo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid MARKETING_VERSION in project.yml: $repo_version"
            exit 1
          }
          latest_tag="$(git tag -l 'v*' | sort -V | tail -n 1 || true)"
          latest="${latest_tag#v}"
          latest="${latest:-0.0.0}"
          base="$(printf '%s\n' "$latest" "$repo_version" | sort -V | tail -n 1)"
          if [[ "$repo_version" != "$latest" && "$base" == "$repo_version" ]]; then
            # The repository version is deliberately ahead of the latest tag:
            # ship it as-is instead of bumping it a second time.
            version="$repo_version"
          else
            IFS='.' read -r major minor patch <<< "$base"
            version="${major}.${minor}.$((patch + 1))"
          fi
          build="$(git rev-list --count HEAD)"
          tag="v${version}"
          echo "Version: ${latest} -> ${version} (build ${build}, tag ${tag})"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            if [[ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Tag ${tag} already points at another commit; bump MARKETING_VERSION in project.yml or investigate."
              exit 1
            fi
            echo "Tag ${tag} already targets this commit; the release will be updated in place."
          fi
          previous_tag="$(git tag -l 'v*' | sort -V | grep -Fvx "${tag}" | tail -n 1 || true)"
          {
            echo "VERSION=${version}"
            echo "BUILD_NUMBER=${build}"
            echo "TAG=${tag}"
            echo "PREVIOUS_TAG=${previous_tag}"
          } >> "$GITHUB_ENV"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          # Same rationale as ci.yml: the committed project.xcproj needs Xcode 27+,
          # runners ship an older Xcode, so regenerate the legacy project.pbxproj.
          rm -f Lode.xcodeproj/project.xcproj
          xcodegen generate

      - name: Setup macOS signing
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ISSUER_ID }}
        run: |
          chmod +x .github/scripts/setup-macos-signing.sh
          source .github/scripts/setup-macos-signing.sh
          echo "signing_identity=${SIGNING_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "team_id=${TEAM_ID}" >> "$GITHUB_OUTPUT"
          echo "api_key_path=${API_KEY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build app (Release, arm64, ad-hoc signed)
        run: |
          set -euo pipefail
          # A SYMROOT override would leak into every SPM checkout and break
          # cross-package swiftmodule discovery (TextStory/Rearrange failure on
          # the first run); -derivedDataPath keeps package builds intact.
          xcodebuild \
            -project Lode.xcodeproj \
            -scheme Lode \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team_id }}" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build

      - name: Codesign app
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release/Lode.app"
          [[ -d "$app" ]] || { echo "::error::Built app not found at $app"; exit 1; }
          chmod +x .github/scripts/sign_app.sh
          .github/scripts/sign_app.sh "$app" \
            "${{ steps.signing.outputs.signing_identity }}" \
            "${{ env.ENTITLEMENTS_PATH }}"

      - name: Create designed DMG
        run: |
          set -euo pipefail
          chmod +x .github/scripts/create-designed-dmg.sh .github/scripts/sign-dmg.sh
          .github/scripts/create-designed-dmg.sh \
            "build/DerivedData/Build/Products/Release/Lode.app" \
            "updates/Lode-${VERSION}.dmg" \
            "Lode" .github/dmg/Lode-dmg-background.png Lode

      - name: Sign disk image
        run: |
          .github/scripts/sign-dmg.sh "updates/Lode-${VERSION}.dmg" "${{ steps.signing.outputs.signing_identity }}"

      - name: Notarize DMG
        run: |
          set -euo pipefail
          dmg="updates/Lode-${VERSION}.dmg"
          xcrun notarytool submit "$dmg" \
            --key "${{ steps.signing.outputs.api_key_path }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_KEY_ISSUER_ID }}" \
            --wait --timeout 15m
          xcrun stapler staple "$dmg"

      - name: Validate notarization
        run: xcrun stapler validate "updates/Lode-${VERSION}.dmg"

      - name: Generate changelog
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_TAG:-}" ]]; then
            printf '## Release %s\n\nInitial release\n' "${VERSION}" > changelog.md
          else
            changes="$(git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s' \
              | grep -Ev '^- (ci|chore|build|style|test)(\(|:)' \
              | sort -u | head -20 || true)"
            [[ -n "$changes" ]] || changes="- Maintenance and stability improvements"
            printf '## Release %s\n\n### Changes since %s\n\n%s\n' \
              "${VERSION}" "${PREVIOUS_TAG}" "${changes}" > changelog.md
          fi
          cat changelog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY_LODE }}
        run: |
          set -euo pipefail
          [[ -n "${SPARKLE_PRIVATE_KEY}" ]] || {
            echo "::error::SPARKLE_PRIVATE_KEY_LODE secret is missing"
            exit 1
          }
          key_file="${RUNNER_TEMP}/lode-ed-private-key.b64"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          rm -rf appcast_input
          mkdir appcast_input
          cp "updates/Lode-${VERSION}.dmg" appcast_input/
          LODE_SPARKLE_ED_KEY_FILE="${key_file}" \
            scripts/release/make-appcast.sh appcast_input \
            "${REPO_LINK}/releases/latest/download/" appcast.xml
          notes_html="$(gh api markdown -F text=@changelog.md -f mode=gfm)"
          export RELEASE_NOTES_HTML="${notes_html}"
          export RELEASE_NOTES_LINK="${REPO_LINK}/releases/latest"
          perl -0777 -pe '
            if (!$done++) {
              my $notes = $ENV{RELEASE_NOTES_HTML} // "";
              my $link = $ENV{RELEASE_NOTES_LINK} // "";
              my $insert = qq{\n            <description><![CDATA[$notes]]></description>\n            <sparkle:fullReleaseNotesLink>$link</sparkle:fullReleaseNotesLink>};
              s/(<sparkle:minimumSystemVersion>[^<]+<\/sparkle:minimumSystemVersion>)(?!\s*<description)/$1$insert/s;
            }
          ' appcast.xml > appcast.tmp.xml && mv appcast.tmp.xml appcast.xml
          rm -f "${key_file}"
          grep -q 'sparkle:edSignature' appcast.xml || {
            echo "::error::appcast has no EdDSA signature"
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          body_path: changelog.md
          files: |
            updates/Lode-*.dmg
            appcast.xml

      - name: Upload to R2
        env:
          WEBHOOK_SECRET: ${{ secrets.COFFIC_APP_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          upload_file() {
            local file="$1"
            local key="$2"
            local response
            echo "Uploading to R2: ${key}"
            response="$(curl -sS -X POST "${R2_API_URL}/lode/upload" \
              -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
              -F "file=@${file}" \
              -F "key=${key}")"
            echo "Response: ${response}"
            echo "${response}" | grep -q '"success":true'
          }
          upload_file "updates/Lode-${VERSION}.dmg" "lode/Lode-${VERSION}.dmg"
          upload_file "appcast.xml" "lode/appcast.xml"

      - name: Clean signing credentials
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/build_certificate.p12" \
            "$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" || true
