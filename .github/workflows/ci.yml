name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-guard:
    name: Reference-name guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for forbidden reference names
        run: |
          set -euo pipefail
          # A competing product used as a maturity benchmark must never be named
          # anywhere in this repository. The pattern is base64-encoded so the
          # literal string is not itself committed. -I skips binary files.
          pattern="$(printf '%s' 'dGFibGVwcm8=' | base64 -d)"
          if git grep -I -i -n -e "$pattern" -- .; then
            echo "::error::Forbidden reference name detected in tracked files."
            exit 1
          fi
          echo "Reference-name guard passed."

  build-test:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          # The repository commits the new-format project.xcproj (read by Xcode 27+).
          # Generate the legacy project.pbxproj from project.yml so the runner's
          # Xcode can read it; only one project definition file may exist.
          rm -f Lode.xcodeproj/project.xcproj
          xcodegen generate
      - name: Build app (single architecture, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lode.xcodeproj \
            -scheme Lode \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build
      - name: Test plugin (offline suites; integration tests are env-gated and auto-skip)
        run: |
          set -euo pipefail
          # LocalizationCatalogTests (string-catalog integrity) and
          # DatabaseCapabilitiesTests (capability-declaration consistency) run
          # here as ordinary offline suites. Real-engine integration tests stay
          # disabled without the LODE_TEST_* environment; see
          # scripts/integration/run-all-tests.sh for the disposable Docker harness.
          swift test --package-path Packages/PluginDatabaseManager
      - name: Test app host manifest (launch assembly budget gate)
        run: |
          set -euo pipefail
          # LodeTests boots the real kernel through the shared LumiFactory
          # assembler. LaunchBudgetGateTests compares the kernel-assembly median
          # against scripts/perf/launch-baseline.json (2x locally when idle, 5x
          # when a CPU-noise probe detects load, flat 5x on CI runners).
          # The opt-in baseline measurement stays disabled without LODE_PERF_MEASURE=1.
          xcodebuild test \
            -project Lode.xcodeproj \
            -scheme Lode \
            -only-testing:LodeTests \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation